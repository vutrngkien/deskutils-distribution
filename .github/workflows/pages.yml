name: Build and deploy DeskUtils website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # A release published or edited in this repo rebuilds the changelog page
  # directly. The app repo can also rebuild the site cross-repo by POSTing a
  # repository_dispatch with type "release-published".
  release:
    types: [published, edited]
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Refresh the changelog snapshot from the GitHub Releases API. Fails the
      # job (without overwriting the snapshot) if the sync cannot complete.
      - name: Sync release notes snapshot
        run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DESKUTILS_FEEDBACK_FORM_ENDPOINT: ${{ vars.DESKUTILS_FEEDBACK_FORM_ENDPOINT }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskutils-website-preview
          path: web/out
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

  deploy:
    needs: build
    # This redesign describes the next app release, not the currently published DMG.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DESKUTILS_WEBSITE_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release verification dependencies
        run: npm ci
        working-directory: web
      - name: Verify matching app release
        run: node web/scripts/verify-release.mjs
        env:
          DESKUTILS_WEBSITE_RELEASE_TAG: ${{ vars.DESKUTILS_WEBSITE_RELEASE_TAG }}
      - name: Verify latest DMG is public
        run: >-
          curl --fail --silent --show-error --location --head --retry 3
          https://github.com/vutrngkien/deskutils-distribution/releases/latest/download/DeskUtils.dmg
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
